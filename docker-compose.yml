services:
  # ============================================================================
  # 1. FastAPI Workflow Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WORKFLOW_DATABASE_URL=${WORKFLOW_DATABASE_URL:-postgresql+psycopg2://postgres:Alethe%40123@192.168.1.171:5432/workflow_erm}
      - WORKFLOW_DB_SCHEMA=${WORKFLOW_DB_SCHEMA:-workflow}
      - SECRET_KEY=${SECRET_KEY:-0eeedb8821a0a275fc8afb816145a44cee60bfc7f55f51b1f091cca47596cdb0}
      - ALGORITHM=${ALGORITHM:-HS256}
      - FERNET_KEY=${FERNET_KEY:-ia3rsWe2JkwStfuoRIOdDtsghWrDuFY02l5tR-XyCIc=}
      - MAIN_URL=${MAIN_URL:-https://192.168.1.191}
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 2. React Vite Workflow Studio Frontend Service (Nginx with SSL)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    volumes:
      - ./backend/certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 3. Prometheus Monitoring Engine (Stage 12)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: workflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - workflow-net

  # ============================================================================
  # 4. Alertmanager (Stage 13)
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: workflow-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    networks:
      - workflow-net

  # ============================================================================
  # 5. Grafana Dashboards & Observability (Stage 14)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: workflow-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - workflow-net

networks:
  workflow-net:
    driver: bridge

volumes:
  backend_logs:
    name: workflow_backend_logs
  backend_data:
    name: workflow_backend_data
  prometheus_data:
    name: workflow_prometheus_data
  grafana_data:
    name: workflow_grafana_data
