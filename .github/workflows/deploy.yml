name: Deploy to Server (192.168.1.191)

on:
  workflow_dispatch:
  push:
    branches: [ "deployment", "main" ]

jobs:
  deploy:
    name: "Deploy Workflow Docker Stack"
    runs-on: [self-hosted, Windows]

    steps:
      - name: "1. Checkout Code"
        uses: actions/checkout@v4

      - name: "2. Deploy Docker Stack"
        shell: cmd
        run: |
          echo ==================================================
          echo Starting Docker Deployment on Server...
          echo ==================================================
          docker compose down --remove-orphans
          docker compose up -d --build --remove-orphans

      - name: "3. Verify Deployment Health"
        shell: powershell
        run: |
          Write-Host "Waiting for containers to initialize..."
          Start-Sleep -Seconds 20
          
          try {
            $response = Invoke-RestMethod -Uri "http://localhost:8000/health" -Method Get -TimeoutSec 15
            Write-Host "✅ Health Response: OK"
            Write-Host ($response | ConvertTo-Json)
            Write-Host "🎉 Enterprise Platform Live at https://192.168.1.191"
          } catch {
            Write-Host "⚠️ Healthcheck warning: $_"
            Write-Host "Checking active Docker containers:"
            docker ps
          }
