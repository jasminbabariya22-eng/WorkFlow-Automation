name: Deploy to Server (192.168.1.183)

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Exact Git commit SHA or branch to deploy (must belong to main and have passing CI)"
        required: false
        default: "main"
  workflow_run:
    workflows: ["Continuous Integration"]
    branches:
      - main
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker Stack on Self-Hosted Runner
    runs-on: [self-hosted, Windows]
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_commit || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Verify Commit Lineage, CI Status, and Freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Write-Host "=========================================================="
          Write-Host "1. Verifying Commit Lineage, CI Status, and Freshness"
          Write-Host "=========================================================="

          # Fetch latest origin/main refs
          git fetch origin main --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to fetch origin main refs."
            exit $LASTEXITCODE
          }

          $currentCommit = (git rev-parse HEAD).Trim()
          $latestMainCommit = (git rev-parse origin/main).Trim()

          Write-Host "Deployment target commit: $currentCommit"
          Write-Host "Latest HEAD of main:      $latestMainCommit"

          # 1. Lineage Check: Commit MUST be an ancestor of or present on main
          $mergeBase = (git merge-base $currentCommit origin/main).Trim()
          if ($mergeBase -ne $currentCommit) {
            Write-Error "SAFETY VIOLATION: Commit $currentCommit is not an ancestor of or present on the production 'main' branch!"
            exit 1
          }
          Write-Host "  - [PASS] Commit lineage verified on 'main'."

          # 2. Anti-Stale Protection for Automatic Deployment
          if ("${{ github.event_name }}" -eq "workflow_run") {
            if ($currentCommit -ne $latestMainCommit) {
              Write-Error "STALE COMMIT DETECTED: Automatic deployment rejected because a newer commit ($latestMainCommit) has already reached main."
              exit 1
            }
            Write-Host "  - [PASS] Commit freshness verified (current HEAD of main)."
          }

          # 3. Verified CI Status Check for Manual Deployment (workflow_dispatch)
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Write-Host "Verifying CI status for commit $currentCommit via GitHub API..."
            $repo = "${{ github.repository }}"
            $headers = @{
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "Accept"        = "application/vnd.github+json"
            }
            $uri = "https://api.github.com/repos/$repo/actions/runs?head_sha=$currentCommit"

            try {
              $runsResponse = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
              $ciRuns = $runsResponse.workflow_runs | Where-Object { $_.name -eq "Continuous Integration" -and $_.status -eq "completed" -and $_.conclusion -eq "success" }

              if (-not $ciRuns -or $ciRuns.Count -eq 0) {
                Write-Error "MANUAL DEPLOYMENT REJECTED: No successful 'Continuous Integration' run was found on record for commit $currentCommit!"
                exit 1
              }
              Write-Host "  - [PASS] Verified successful CI run ($($ciRuns[0].id)) for commit $currentCommit."
            } catch {
              Write-Error "Failed to query GitHub CI status API: $_"
              exit 1
            }
          }

      - name: Validate Production Secrets and Provision Environment
        env:
          WORKFLOW_DATABASE_URL: ${{ secrets.WORKFLOW_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          MAIN_URL: ${{ secrets.MAIN_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          WORKFLOW_DB_SCHEMA: "workflow"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          GRAFANA_ADMIN_USER: "admin"
        run: |
          Write-Host "=========================================================="
          Write-Host "2. Validating Production Secrets & Provisioning Environment"
          Write-Host "=========================================================="

          # Install validator dependencies
          python -m pip install --quiet cryptography python-dotenv
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to install Python cryptography dependency."
            exit $LASTEXITCODE
          }

          # Execute strict validator with atomic file generation
          python backend/validate_env_secrets.py --write
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Production secret validation failed! Deployment aborted."
            exit $LASTEXITCODE
          }

      - name: Generate and Validate SSL Certificates
        run: |
          Write-Host "=========================================================="
          Write-Host "3. Generating & Validating SSL Certificates with SAN"
          Write-Host "=========================================================="

          # Generate certificate using the configured MAIN_URL
          python backend/generate_ssl_certs.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to execute generate_ssl_certs.py."
            exit $LASTEXITCODE
          }

          # Verify certificate and private key consistency, expiration, and SAN coverage
          python backend/generate_ssl_certs.py --verify
          if ($LASTEXITCODE -ne 0) {
            Write-Error "SSL certificate verification failed!"
            exit $LASTEXITCODE
          }

      - name: Build and Deploy Containers with Safety Tagging
        run: |
          Write-Host "=========================================================="
          Write-Host "4. Building & Deploying Docker Containers"
          Write-Host "=========================================================="

          # 1. Pre-flight: Verify Docker Engine is active
          docker info 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: Docker Desktop / Engine is not running on this host!"
            exit $LASTEXITCODE
          }

          # 2. Pre-flight: Validate Compose configuration syntax
          docker compose config --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: docker-compose.yml configuration is invalid!"
            exit $LASTEXITCODE
          }

          # 3. Rollback Safety: Tag existing container images as previous
          try {
            $prevBackend = (docker inspect --format '{{.Image}}' workflow-backend 2>$null)
            $prevFrontend = (docker inspect --format '{{.Image}}' workflow-frontend 2>$null)
            if ($prevBackend) { docker tag $prevBackend workflow-backend:previous 2>$null }
            if ($prevFrontend) { docker tag $prevFrontend workflow-frontend:previous 2>$null }
          } catch {
            Write-Host "Notice: No previous container images to tag for rollback."
          }

          # 4. Build images in-place
          docker compose build
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker compose build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          # 5. Start/recreate containers seamlessly
          docker compose up -d --remove-orphans
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker compose up failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "Containers updated. Waiting for initialization..."

      - name: Validate Container and Service Health
        run: |
          Write-Host "=========================================================="
          Write-Host "5. Verifying Container, API, and Web Health"
          Write-Host "=========================================================="

          $maxRetries = 20
          $retryCount = 0
          $isHealthy = $false

          # Trust self-signed certificates during localhost health checks
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = {$true}

          while ($retryCount -lt $maxRetries) {
            Start-Sleep -Seconds 4
            $retryCount++
            Write-Host "[$retryCount/$maxRetries] Testing container health..."

            $backendHttpOk = $false
            $frontendHttpOk = $false
            $frontendHttpsOk = $false
            $containerStateOk = $false

            # 1. Container Running State
            try {
              $beState = (docker inspect --format '{{.State.Status}}' workflow-backend 2>$null).Trim()
              $feState = (docker inspect --format '{{.State.Status}}' workflow-frontend 2>$null).Trim()
              if ($beState -eq "running" -and $feState -eq "running") {
                $containerStateOk = $true
              }
            } catch {}

            # 2. Backend HTTP Health (:8000/health)
            try {
              $resp = Invoke-RestMethod -Uri "http://localhost:8000/health" -Method Get -TimeoutSec 5
              if ($resp.status -eq "healthy") {
                $backendHttpOk = $true
              }
            } catch {}

            # 3. Frontend HTTP Web Server (:80/)
            try {
              $feResp = Invoke-WebRequest -Uri "http://localhost:80/" -Method Get -UseBasicParsing -TimeoutSec 5
              if ($feResp.StatusCode -eq 200) {
                $frontendHttpOk = $true
              }
            } catch {}

            # 4. Frontend HTTPS Endpoint (:443/)
            try {
              $httpsResp = Invoke-WebRequest -Uri "https://localhost:443/" -Method Get -UseBasicParsing -TimeoutSec 5
              if ($httpsResp.StatusCode -eq 200) {
                $frontendHttpsOk = $true
              }
            } catch {}

            if ($containerStateOk -and $backendHttpOk -and $frontendHttpOk -and $frontendHttpsOk) {
              Write-Host "All Health Checks PASSED (Containers, Backend API, Frontend HTTP, and Frontend HTTPS)!"
              $isHealthy = $true
              break
            }
          }

          if (-not $isHealthy) {
            Write-Error "DEPLOYMENT FAILED: One or more health checks did not succeed within timeout."
            Write-Host "Diagnostics: Containers Running: $containerStateOk | Backend HTTP: $backendHttpOk | Frontend HTTP: $frontendHttpOk | Frontend HTTPS: $frontendHttpsOk"
            exit 1
          }

          Write-Host "=========================================================="
          Write-Host "DEPLOYMENT VERIFIED AND SUCCESSFUL!"
          Write-Host "=========================================================="
          Write-Host " - Web UI (HTTPS):   https://192.168.1.183"
          Write-Host " - Web UI (HTTP):    http://192.168.1.183"
          Write-Host " - API Swagger Docs: http://192.168.1.183:8000/docs"
          Write-Host " - Observability:    http://192.168.1.183:3001"
          docker compose ps

      - name: Diagnostic Logs and Recovery on Failure
        if: failure()
        run: |
          Write-Host "=========================================================="
          Write-Host "DIAGNOSTIC LOGS (DEPLOYMENT FAILURE)"
          Write-Host "=========================================================="
          docker compose ps -a
          Write-Host "--- Backend Container Logs ---"
          docker compose logs --tail=60 backend
          Write-Host "--- Frontend Container Logs ---"
          docker compose logs --tail=60 frontend
