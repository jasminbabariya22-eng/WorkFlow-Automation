name: Deploy to Production (Self-Hosted Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker Stack on Self-Hosted Runner
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Prerequisites & SSL
        run: |
          Write-Host "=========================================================="
          Write-Host "1. Verifying Deployment Host Prerequisites & SSL"
          Write-Host "=========================================================="

          # 1. Check Docker Engine
          try {
            docker info | Out-Null
            Write-Host "Docker Desktop / Engine is running."
          } catch {
            Write-Error "CRITICAL: Docker Desktop is not running on this host!"
            exit 1
          }

          # 2. Check / Generate SSL Certificates
          if (-not (Test-Path "backend\certs\fullchain.pem")) {
            Write-Host "Generating SSL certificates for 192.168.1.183 / localhost..."
            try {
              python -m pip install --quiet cryptography python-dotenv
              python "backend\generate_ssl_certs.py"
            } catch {
              Write-Host "Notice: SSL certificate generation output: $_"
            }
          }

          if (Test-Path "backend\certs\fullchain.pem") {
            Write-Host "SSL certificates verified in backend\certs."
          } else {
            Write-Warning "backend\certs\fullchain.pem not found yet; attempting fallback generation..."
            python -m pip install cryptography python-dotenv
            python "backend\generate_ssl_certs.py"
          }

      - name: Configure Production Environment Variables
        env:
          SECRET_WORKFLOW_DATABASE_URL: ${{ secrets.WORKFLOW_DATABASE_URL }}
          SECRET_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SECRET_FERNET_KEY: ${{ secrets.FERNET_KEY }}
          SECRET_MAIN_URL: ${{ secrets.MAIN_URL }}
        run: |
          Write-Host "=========================================================="
          Write-Host "2. Configuring Production Environment Variables"
          Write-Host "=========================================================="

          if ($env:SECRET_WORKFLOW_DATABASE_URL) {
            Write-Host "Provisioning .env from GitHub Secrets..."
            $envLines = @(
              "WORKFLOW_DATABASE_URL=$($env:SECRET_WORKFLOW_DATABASE_URL)",
              "WORKFLOW_DB_SCHEMA=workflow",
              "SECRET_KEY=$($env:SECRET_SECRET_KEY)",
              "ALGORITHM=HS256",
              "ACCESS_TOKEN_EXPIRE_MINUTES=60",
              "FERNET_KEY=$($env:SECRET_FERNET_KEY)",
              "MAIN_URL=$($env:SECRET_MAIN_URL)"
            )
            $envLines | Set-Content -Path ".env" -Encoding ASCII
          } elseif (Test-Path "..\..\..\.env") {
            Copy-Item "..\..\..\.env" ".env" -Force
            Write-Host "Copied production .env from runner root folder."
          } elseif (Test-Path "C:\actions-runner\.env") {
            Copy-Item "C:\actions-runner\.env" ".env" -Force
            Write-Host "Copied production .env from C:\actions-runner\.env"
          } elseif (Test-Path "C:\Windows\System32\actions-runner\.env") {
            Copy-Item "C:\Windows\System32\actions-runner\.env" ".env" -Force
            Write-Host "Copied production .env from C:\Windows\System32\actions-runner\.env"
          } elseif (Test-Path "backend\.env.example") {
            Write-Host "Initializing .env from template..."
            Copy-Item "backend\.env.example" ".env"
          }

          if (Test-Path ".env") {
            Copy-Item ".env" "backend\.env" -Force
            Write-Host "Environment file is ready."
          }

      - name: Build and Deploy Containers
        run: |
          Write-Host "=========================================================="
          Write-Host "3. Building & Updating Docker Containers (In-Place)"
          Write-Host "=========================================================="

          # Build images first without stopping current containers
          docker compose build

          # Update containers seamlessly without downtime (preserves persistent volumes)
          docker compose up -d --remove-orphans

          Write-Host "Containers updated. Waiting for initialization..."

      - name: Validate Container Health Checks
        run: |
          Write-Host "=========================================================="
          Write-Host "4. Verifying Production Service Health Status"
          Write-Host "=========================================================="

          $maxRetries = 15
          $retryCount = 0
          $isHealthy = $false

          while ($retryCount -lt $maxRetries) {
            Start-Sleep -Seconds 4
            $retryCount++
            Write-Host "[$retryCount/$maxRetries] Testing http://localhost:8000/health..."

            try {
              $resp = Invoke-RestMethod -Uri "http://localhost:8000/health" -Method Get -TimeoutSec 5
              if ($resp.status -eq "healthy") {
                Write-Host "Backend API is Healthy!"
                $isHealthy = $true
                break
              }
            } catch {
              Write-Host "Waiting for service to become responsive..."
            }
          }

          if (-not $isHealthy) {
            Write-Error "DEPLOYMENT FAILED: Backend health check did not report healthy within timeout."
            Write-Host "Recent backend container logs:"
            docker logs --tail 50 workflow-backend
            exit 1
          }

          Write-Host "=========================================================="
          Write-Host "DEPLOYMENT SUCCESSFUL!"
          Write-Host "=========================================================="
          Write-Host " - Web UI (HTTPS):   https://192.168.1.183"
          Write-Host " - Web UI (HTTP):    http://192.168.1.183"
          Write-Host " - API Swagger Docs: http://192.168.1.183:8000/docs"
          Write-Host " - Observability:    http://192.168.1.183:3001"
          docker compose ps

      - name: Diagnostic Logs on Failure
        if: failure()
        run: |
          Write-Host "=========================================================="
          Write-Host "DIAGNOSTIC LOGS (DEPLOYMENT FAILURE)"
          Write-Host "=========================================================="
          Write-Host "--- Docker Containers ---"
          docker compose ps -a
          Write-Host "--- Backend Logs ---"
          docker compose logs --tail=60 backend
          Write-Host "--- Frontend Logs ---"
          docker compose logs --tail=60 frontend
