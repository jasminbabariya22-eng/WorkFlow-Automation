name: Continuous Deployment (Local Server 192.168.1.183)

on:
  push:
    branches: [ "main", "development" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'

jobs:
  deploy-to-local-server:
    name: Deploy to On-Premise Production Server
    runs-on: self-hosted

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Deploy Docker Stack
        run: |
          Write-Host "🚀 Deploying Workflow Platform on 192.168.1.183..."
          docker compose down --remove-orphans
          docker compose up -d --build --remove-orphans

      - name: Wait for Containers to Initialize
        run: |
          Write-Host "⏳ Waiting for backend healthcheck..."
          Start-Sleep -Seconds 15

      - name: Validate Deployment (Smoke Test)
        run: |
          Write-Host "🔍 Running Post-Deployment Health Check..."
          try {
            $response = Invoke-RestMethod -Uri "http://localhost:8000/health" -Method Get -TimeoutSec 10
            Write-Host "Response:" ($response | ConvertTo-Json)
            Write-Host "✅ Deployment Healthy & Active at http://192.168.1.183"
          } catch {
            Write-Error "Health check failed: $_"
            exit 1
          }

