name: Continuous Deployment (Local Server 192.168.1.183)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'

jobs:
  deploy-to-local-server:
    name: "Stage 9-11: GitOps Rollout & Post-Deployment Validations"
    runs-on: self-hosted

    steps:
      - name: "Stage 9: Checkout Latest Code (GitOps Sync)"
        uses: actions/checkout@v4

      - name: "Stage 10: Deploy Docker Stack (Zero-Downtime Rollout)"
        run: |
          Write-Host "🚀 Deploying Workflow Platform on 192.168.1.183..."
          docker compose down --remove-orphans
          docker compose up -d --build --remove-orphans

      - name: "Wait for Containers & Metrics to Initialize"
        run: |
          Write-Host "⏳ Waiting for backend and monitoring healthcheck..."
          Start-Sleep -Seconds 15

      - name: "Stage 11: Post-Deployment Validations (Smoke & Metrics Test)"
        run: |
          Write-Host "🔍 Running Stage 11: Post-Deployment Health & Telemetry Validation..."
          try {
            $health = Invoke-RestMethod -Uri "http://localhost:8000/health" -Method Get -TimeoutSec 10
            Write-Host "✅ Health Response:" ($health | ConvertTo-Json)
            
            $metrics = Invoke-RestMethod -Uri "http://localhost:8000/metrics" -Method Get -TimeoutSec 10
            Write-Host "✅ Prometheus Metrics Active at /metrics"
            
            Write-Host "🎉 Enterprise Deployment & Observability Healthy at http://192.168.1.183"
          } catch {
            Write-Error "Post-Deployment validation failed: $_"
            exit 1
          }
