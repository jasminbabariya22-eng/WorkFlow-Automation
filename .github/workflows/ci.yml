name: Continuous Integration

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      WORKFLOW_DATABASE_URL: sqlite:///main_test.db
      DATABASE_URL: sqlite:///main_test.db
      SECRET_KEY: test_mock_jwt_secret_key_only_for_unit_tests_1234567890
      FERNET_KEY: ia3rsWe2JkwStfuoRIOdDtsghWrDuFY02l5tR-XyCIc=
      WORKFLOW_DB_SCHEMA: workflow
      ALGORITHM: HS256
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unixodbc-dev \
            freetds-dev \
            libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Dependency Security Audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
        continue-on-error: true

      - name: Run Backend Test Suite with Coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml

  frontend-ci:
    name: Frontend CI (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Frontend Dependency Security Audit
        run: npm audit
        continue-on-error: true

      - name: Run frontend linter (oxlint)
        run: npm run lint

      - name: Run frontend production build (vite build)
        run: npm run build

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image (Validation only)
        run: docker build -t workflow-backend:ci ./backend

      - name: Scan Backend Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'workflow-backend:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Docker Image (Validation only)
        run: docker build -t workflow-frontend:ci ./frontend

      - name: Scan Frontend Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'workflow-frontend:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
