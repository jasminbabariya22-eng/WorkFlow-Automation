name: CI & DevSecOps Quality Gate

on:
  push:
    branches: [ "main", "development", "deployment" ]
  pull_request:
    branches: [ "main", "development", "deployment" ]

jobs:
  # ============================================================================
  # 1. Backend CI & Tests
  # ============================================================================
  backend-ci:
    name: Backend CI (Pytest & Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev unixodbc-dev freetds-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          cd backend
          pytest -v || echo "Pytest completed with status $?"

  # ============================================================================
  # 2. Frontend CI & Build
  # ============================================================================
  frontend-ci:
    name: Frontend CI (Build & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Lint
        run: |
          cd frontend
          npm run lint || echo "Linting completed"

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 3. Docker Image Build & Trivy Security Vulnerability Scan
  # ============================================================================
  docker-security-scan:
    name: Docker Build & Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Backend Image Build & Scan ---
      - name: Build Backend Docker Image
        run: |
          docker build -t workflow-backend:ci ./backend

      - name: Run Trivy Security Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'workflow-backend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # --- Frontend Image Build & Scan ---
      - name: Build Frontend Docker Image
        run: |
          docker build -t workflow-frontend:ci ./frontend

      - name: Run Trivy Security Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'workflow-frontend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
